name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - run: python scripts/validate_release.py
      - run: python wiki/build.py check
      - name: Verify frozen statistics checksum
        working-directory: results/frozen/20260630_public_release
        run: sha256sum --check checksums.sha256
